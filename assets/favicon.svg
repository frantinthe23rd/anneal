<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Anneal">
  <!-- The anvil from the UI's empty state, in the forge gradient. Drawn on its
       own dark plate rather than transparently: the mark has to hold up in a
       light browser tab as well as a dark one. -->
  <defs>
    <linearGradient id="heat" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#b8431a"/>
      <stop offset=".45" stop-color="#ff5f1f"/>
      <stop offset="1" stop-color="#ffb03a"/>
    </linearGradient>
    <radialGradient id="bloom" cx=".5" cy="1" r=".9">
      <stop offset="0" stop-color="#ff5f1f" stop-opacity=".38"/>
      <stop offset="1" stop-color="#ff5f1f" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="32" height="32" rx="7" fill="#100d0c"/>
  <rect width="32" height="32" rx="7" fill="url(#bloom)"/>
  <g fill="none" stroke="url(#heat)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 18h15l4-5h4"/>
    <path d="M8 18v5h11v-5"/>
    <path d="M11 13l2-6h5l-1 6"/>
  </g>
</svg>
